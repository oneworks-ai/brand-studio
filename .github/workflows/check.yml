name: Check generated assets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brand-studio
      - uses: actions/checkout@v4
        with:
          repository: oneworks-ai/app
          path: app
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm render
        working-directory: brand-studio
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ONEWORKS_APP_ROOT: ${{ github.workspace }}/app
      - run: pnpm check
        working-directory: brand-studio
        env:
          ONEWORKS_APP_ROOT: ${{ github.workspace }}/app
      - name: Require committed generated output
        run: git diff --exit-code -- index.html dist
        working-directory: brand-studio
