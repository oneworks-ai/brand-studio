name: Render brand assets

on:
  push:
    branches: [main]
    paths:
      - assets/icons/**
      - catalog/**
      - distribution/**
      - scripts/**
      - src/**
      - studio.config.json
  repository_dispatch:
    types: [product-catalog-updated]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-brand-assets
  cancel-in-progress: false

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brand-studio
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: oneworks-ai/app
          path: app
          ref: ${{ github.event.client_payload.source_sha || 'main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync product catalog icons
        run: pnpm sync:catalog
        working-directory: brand-studio
        env:
          ONEWORKS_APP_ROOT: ${{ github.workspace }}/app
      - run: pnpm render
        working-directory: brand-studio
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ONEWORKS_APP_ROOT: ${{ github.workspace }}/app
      - run: pnpm check
        working-directory: brand-studio
        env:
          ONEWORKS_APP_ROOT: ${{ github.workspace }}/app
          ONEWORKS_SKIP_DISTRIBUTION_SYNC_CHECK: 1
      - name: Publish generated assets to the automation branch
        working-directory: brand-studio
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || 'main' }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "The generated catalog and assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/render-brand-assets:refs/remotes/origin/automation/render-brand-assets || true
          git switch --force-create automation/render-brand-assets
          git add assets catalog dist index.html
          git commit \
            -m "chore: refresh generated brand assets" \
            -m "One Works app source: ${SOURCE_SHA}"
          git push --force-with-lease origin HEAD:automation/render-brand-assets

          echo "::notice title=Brand Studio assets ready::Generated assets were published to automation/render-brand-assets. Repository policy requires a maintainer or Git operator to open the pull request."
